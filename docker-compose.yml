services:
  bot:
    build: .
    container_name: mestretatu-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # This line maps your local code into the container for development
      - ./src:/app/src
      # This new line maps our persistent volume to the /app/data directory
      - mestre-tatu-data:/app/src/logs/data

# This new section defines the named volume
volumes:
  mestre-tatu-data: