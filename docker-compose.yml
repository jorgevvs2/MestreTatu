# docker-compose.yml

services:
  bot:
    build: .
    container_name: mestretatu-bot
    restart: unless-stopped
    env_file:
      - .env
    # --- CORREÇÃO AQUI ---
    # Adiciona uma configuração de DNS para estabilizar a conexão com o Discord.
    dns:
      - 8.8.8.8 # DNS do Google
      - 1.1.1.1 # DNS da Cloudflare
    volumes:
      # Mapeamento do código-fonte (continua o mesmo)
      - ./src:/app/src
      # CORREÇÃO: Mapeia a pasta local './data' para '/app/data' no container.
      # Esta é a forma padrão e mais limpa de persistir dados.
      - ./data:/app/data

# A seção de volumes nomeados não é mais necessária com o bind mount,
# então ela foi removida.